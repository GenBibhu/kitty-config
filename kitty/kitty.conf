# Futuristic minimal Kitty profile
# Backup of the previous config:
#   ~/.config/kitty/backups/kitty.conf.bak-20260501-setup

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

disable_ligatures never
symbol_map U+e000-U+f8ff JetBrainsMono Nerd Font

include theme.conf

# Clean, stable chrome
background_opacity 0.82
dynamic_background_opacity yes
background_blur 18
window_padding_width 12
window_margin_width 0
hide_window_decorations yes
confirm_os_window_close 0
resize_debounce_time 0.08
placement_strategy center

# Cursor and terminal behavior
cursor_shape beam
cursor_blink_interval 0.55
cursor_stop_blinking_after 12
shell_integration enabled
term xterm-kitty
startup_session fullscreen.session
enable_audio_bell no
visual_bell_duration 0.0
remember_window_size yes
initial_window_width 118c
initial_window_height 34c

# Scrollback and copy behavior
scrollback_lines 12000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 1.0
url_style curly
open_url_with default

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_title_template " {index}: {title} "
active_tab_title_template " {index}: {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# Tiling layouts
enabled_layouts tall:bias=65;full_size=1;mirrored=false,stack,grid,horizontal,vertical,splits,fat
remember_window_size yes

# Kitty modifier
kitty_mod ctrl+shift

# Windows / splits
map kitty_mod+enter launch --type=window --cwd=current --location=split
map kitty_mod+backslash launch --type=window --cwd=current --location=vsplit
map kitty_mod+minus launch --type=window --cwd=current --location=hsplit
map kitty_mod+w close_window
map kitty_mod+space next_layout
map kitty_mod+z toggle_layout stack

# Focus windows, Vim-style plus arrows
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map kitty_mod+left neighboring_window left
map kitty_mod+down neighboring_window down
map kitty_mod+up neighboring_window up
map kitty_mod+right neighboring_window right

# Move windows
map kitty_mod+alt+h move_window left
map kitty_mod+alt+j move_window down
map kitty_mod+alt+k move_window up
map kitty_mod+alt+l move_window right
map kitty_mod+alt+left move_window left
map kitty_mod+alt+down move_window down
map kitty_mod+alt+up move_window up
map kitty_mod+alt+right move_window right

# Resize windows
map kitty_mod+alt+equal resize_window wider 5
map kitty_mod+alt+minus resize_window narrower 5
map kitty_mod+r start_resizing_window

# Tabs
map kitty_mod+t new_tab_with_cwd
map kitty_mod+q close_tab
map kitty_mod+] next_tab
map kitty_mod+[ previous_tab
map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 10
map kitty_mod+e set_tab_title

# Search, scrollback, hints
map kitty_mod+f search_scrollback
map kitty_mod+g show_scrollback
map kitty_mod+u kitten hints --type url --program default
map kitty_mod+p kitten hints --type path --program -
map kitty_mod+y kitten hints --type line --program @

# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection

# Font size
map kitty_mod+plus change_font_size all +1.0
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+backspace change_font_size all -1.0
map kitty_mod+alt+0 change_font_size all 0
